name: Build Cely Mod Checker for Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installa PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Crea il programma EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Cely_Mod_Checker cely_mod_checker.py
      - name: Rendi disponibile il file EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cely-Mod-Checker-Windows11
          path: dist/Cely_Mod_Checker.exe
